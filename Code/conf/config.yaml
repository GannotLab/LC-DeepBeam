# ==============================================================================
wandb:
  project_name: "DNN_Based_Beamformer"
  entity_2spk:  "engelori55-bar-ilan-university"
  entity_3spk:  "engelbar73-bar-ilan-university"


# ==============================================================================
# 6. Training Hyperparameters
# ==============================================================================
model_hp:
  train_size_spilt:    0.75
  val_size_spilt:      0.25
  epochs:              300
  data_loader_shuffle: False
  test_loader_shuffle: False
  batchSize_2spk:      8      # Use 4 for Reverberant Environments
  batchSize_3spk:      4


# ==============================================================================
# 7. Optimizer Settings
# ==============================================================================
optimizer:
  optimizer:          Adam
  weight_decay:       0.0
  learning_rate_2spk: 4.0e-4  # Use 7.5e-4 for Reverberant Environments
  learning_rate_3spk: 7.5e-4


# ==============================================================================
# 8. CSV Paths (Ignore the word 'tracking'; It's a legacy name)
