dataset:
  df_path_train_2spk: /home/dsi/engelor1/DNN_Based_Beamformer/Code/create_dataset_python/room_parameters_tracking_train_speechFromTrain.csv
  df_path_test_2spk:  /home/dsi/engelor1/DNN_Based_Beamformer/Code/create_dataset_python/room_parameters_tracking_test.csv
  df_path_train_3spk: /home/dsi/engelba3/DNN_Based_Beamformer/Code/create_dataset_python/room_parameters_tracking_train_speechFromTrain.csv
  df_path_test_3spk:  /home/dsi/engelba3/DNN_Based_Beamformer/Code/create_dataset_python/room_parameters_tracking_test.csv


# ==============================================================================
# 9. Hydra Native Settings
# ==============================================================================
hydra:
  run:
    dir: outputs_L1/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: True