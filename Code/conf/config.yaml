  train_path:              /dsi/gannot-lab/gannot-lab1/datasets/Ilai_data/Tracking_Signal_Gen_Data/Train_Rev_Signal_Gen_with_rir
  test_path:               /dsi/gannot-lab/gannot-lab1/datasets/Ilai_data/Tracking_Signal_Gen_Data/Test_Rev_Signal_Gen_with_rir
  babble_noise_train_path: /dsi/gannot-lab/gannot-lab1/datasets/Ilai_data/Babble_Noise/Train
  babble_noise_test_path:  /dsi/gannot-lab/gannot-lab1/datasets/Ilai_data/Babble_Noise/Test
  
